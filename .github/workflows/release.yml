name: Release macOS build

# Builds an unsigned, non-notarized DMG on every push to main and publishes
# it as a GitHub Release. There's no Apple Developer account behind this —
# CSC_IDENTITY_AUTO_DISCOVERY=false skips electron-builder's codesign-identity
# lookup, and electron-builder.yml already has notarize: false. Users who
# download the DMG will need to right-click → Open (or `xattr -cr` it) past
# Gatekeeper's "unidentified developer" warning; that's unavoidable without
# a paid certificate.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build main/preload/renderer
        run: npm run build

      - name: Package DMG (unsigned — no Apple Developer account)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --x64 --arm64 --publish never

      - name: Compute release metadata
        id: meta
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Rewind build #${{ github.run_number }} (${{ steps.meta.outputs.sha_short }})
          prerelease: true
          generate_release_notes: true
          files: dist/*.dmg
